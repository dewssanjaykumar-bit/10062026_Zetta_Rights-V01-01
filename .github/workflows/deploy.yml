name: Deploy Static Site to GitHub Pages

on:
  push:
    branches: [ "main" ]

# Grant permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout your repository code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup GitHub Pages configuration
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 3. Upload your entire repository (or a specific folder if your files are inside one, e.g., 'public/')
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Change this to './public' or your folder name if your files aren't in the root

      # 4. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4