<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | ZettaRights</title>
    <link rel="stylesheet" href="./assets/css/base.css" />
    <script src="./assets/js/tailwind.js"></script>
    <link rel="stylesheet" href="./assets/css/login.css" />
    <link
      rel="icon"
      href="./assets/images/Home/favicon.ico"
      type="image/x-icon"
    />
  </head>
  <body class="content-center">
    <div
      class="login-card w-[32.5vw] mx-auto px-[3.5vw] py-[3vw] rounded-[2vw]"
    >
      <div class="logo w-[12vw] mx-auto min-w-[120px]">
        <img src="./assets/images/Login/loginLogo.png" alt="" />
      </div>
      <h1 class="login-title text-[clamp(2rem,2.8vw,3.3rem)] mt-[2vw]">
        Login
      </h1>
      <p class="login-desc text-[clamp(14px,1vw,20px)]">Join Us Now!</p>
      <div class="form-group py-[1vw] pt-[2.5vw] flex items-center gap-[10px]">
        <div
          class="email border-[1px] border-white rounded-[7px] w-0 flex-grow"
        >
          <input
            type="tel"
            class="email-input rounded-[7px] bg-transparent w-[100%] text-[clamp(12px,1vw,20px)] p-[15px] pl-[1.5vw]"
            placeholder="Enter Your Email"
          />
        </div>
      </div>
      <div class="form-group py-[1vw] pt-[1vw]">
        <input type="checkbox" name="terms" id="terms" />
        <label
          for="terms"
          class="text-[clamp(12px,0.8vw,18px)] text-[#cecece] terms-label"
          >By creating an account, you agree to ZettaRights
          <span class="text-[var(--clr-link)]">Terms and Conditions</span> and
          <span class="text-[var(--clr-link)]">Privacy Notice</span></label
        >
      </div>
      <button
        class="request-otp-btn w-[100%] py-[.5em] bg-[var(--clr-link)] text-[clamp(1rem,1.3vw,2rem)] text-[var(--bg-card)] rounded-[10px]"
      >
        Request OTP
      </button>
      <div class="create-new text-center pt-[2vw] text-[clamp(14px,1vw,20px)]">
        Create a new account?
      </div>
    </div>
    <div
      class="otp-card w-[32.5vw] hidden mx-auto px-[3.5vw] py-[3vw] rounded-[2vw]"
    >
      <div class="logo w-[12vw] mx-auto min-w-[120px]">
        <img src="./assets/images/Login/loginLogo.png" alt="" />
      </div>

      <h1 class="otp-title text-[clamp(2rem,3.8vw,4rem)] mt-[2vw]">
        OTP Verify
      </h1>
      <p class="subtitle text-[clamp(14px,1.3vw,22px)] text-[#afafaf]">
        Enter the OTP sent to
        <span class="text-white">yazhiththan@gmail.com</span>
      </p>
      <div class="otp-boxes flex justify-center gap-[2.8vw] py-[2vw]">
        <input
          maxlength="1"
          class="otp-input text-[clamp(1.5rem,2vw,2.5rem)] text-center border-[1px] border-white bg-transparent"
        />
        <input
          maxlength="1"
          class="otp-input text-[clamp(1.5rem,2vw,2.5rem)] text-center border-[1px] border-white bg-transparent"
        />
        <input
          maxlength="1"
          class="otp-input text-[clamp(1.5rem,2vw,2.5rem)] text-center border-[1px] border-white bg-transparent"
        />
        <input
          maxlength="1"
          class="otp-input text-[clamp(1.5rem,2vw,2.5rem)] text-center border-[1px] border-white bg-transparent"
        />
      </div>

      <button
        class="verify-btn w-[100%] py-[.5em] bg-[var(--clr-link)] text-[clamp(1rem,1.3vw,2rem)] text-[var(--bg-card)] rounded-[10px]"
      >
        Verify
      </button>
      <p
        class="footer text-center pt-[1.5vw] text-[clamp(12px,1.2vw,22px)] text-[#b9b9b9]"
      >
        Didn't receive the OTP?
        <a href="#" class="text-[var(--clr-link)]">Resend</a>
      </p>

      <p class="timer text-center text-[clamp(12px,1vw,20px)] mt-[1.5vw]">
        1:05 Mins
      </p>
    </div>
    <div
      class="create-account-card hidden w-[32.5vw] mx-auto px-[3.5vw] py-[3vw] rounded-[2vw]"
    >
      <div class="logo w-[8.5vw] mx-auto min-w-[80px]">
        <img src="./assets/images/Login/loginLogo.png" alt="" />
      </div>
      <h1 class="card-title text-[clamp(14px,1.8vw,2.5rem)] mt-[2.5vw]">Create New Account</h1>
      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input
          type="text"
          id="fullname"
          placeholder="Enter Your Name"
          class="email-input border-white border-[1px] rounded-[5px] bg-transparent w-[100%] text-[clamp(12px,1vw,20px)] p-[15px] pl-[1.5vw]"
        />
      </div>
      <div class="form-group">
        <label for="mobile">Email Address</label>
        <input
          type="text"
          id="mobile"
          placeholder="Enter Your Email Address"
          class="email-input border-white border-[1px] rounded-[5px] bg-transparent w-[100%] text-[clamp(12px,1vw,20px)] p-[15px] pl-[1.5vw]"
        />
      </div>
      <div class="form-group user-type">
        <label for="buyer">
          <input type="radio" name="user-type" id="buyer" checked />
          Buyer
        </label>
        <label for="seller">
          <input type="radio" name="user-type" id="seller" />
          Seller
        </label>
      </div>
      <button
        class="next-btn w-[100%] py-[.5em] bg-[var(--clr-link)] text-[clamp(1rem,1.3vw,2rem)] text-[var(--bg-card)] rounded-[10px]"
      >
        Next
      </button>
    </div>
    <script src="./assets/js/login.js"></script>
  </body>
</html>
